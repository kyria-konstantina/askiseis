<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Συμπληρώνω τον ή των</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9f8f4;--card:#ffffff;--ink:#17324d;--soft:#4d6680;--frame:#2bb3c9;--lime:#b5d334;--ok:#2a9d5c;--okbg:#e3f6ea;--no:#d9480f;--nobg:#fde9e1;--btn:#f2f7fb;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10222a;--card:#1a3039;--ink:#e6f3f7;--soft:#a3c0cc;--frame:#2a93a6;--lime:#8ea62a;--ok:#5fd394;--okbg:#173a2a;--no:#ff8a5c;--nobg:#45251a;--btn:#24414c;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10222a;--card:#1a3039;--ink:#e6f3f7;--soft:#a3c0cc;--frame:#2a93a6;--lime:#8ea62a;--ok:#5fd394;--okbg:#173a2a;--no:#ff8a5c;--nobg:#45251a;--btn:#24414c;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comfortaa","Trebuchet MS",Arial,sans-serif}
main{max-width:820px;margin:16px auto;padding:22px 18px 30px;background:var(--card);border:10px solid var(--frame);outline:6px solid var(--lime);outline-offset:-16px;border-radius:22px}
h1{text-align:center;font-size:1.8rem;margin:6px 0 4px}
.lead{text-align:center;color:var(--soft);margin:0 0 18px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px}
.item.ok{background:var(--okbg)}.item.no{background:var(--nobg)}
.slot{min-width:56px;text-align:center;font-weight:700;font-size:1.25rem;border-bottom:3px dotted var(--frame);padding-bottom:2px}
.item.ok .slot{color:var(--ok);border-color:var(--ok)}
.item.no .slot{color:var(--no);border-color:var(--no)}
.word{font-size:1.35rem;font-weight:700;flex:1}
.choice{display:flex;gap:6px}
.choice button{font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:var(--btn);border:2px solid var(--frame);border-radius:10px;padding:6px 10px;cursor:pointer;min-width:52px}
.choice button:hover{transform:scale(1.06)}
.choice button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.score{text-align:center;font-size:1.3rem;font-weight:700;margin-top:20px;min-height:1.5em}
.actions{text-align:center}
.again{font:inherit;font-weight:700;background:var(--ink);color:var(--card);border:0;border-radius:12px;padding:10px 22px;cursor:pointer;margin-top:8px}
@media (max-width:620px){.grid{grid-template-columns:1fr}main{border-width:7px}}
@media (prefers-reduced-motion:reduce){.choice button:hover{transform:none}}
</style>
</head>
<body>
<main>
<h1>Συμπληρώνω τον ή των</h1>
<p class="lead">Πάτησε <b>τον</b> για έναν (ενικός) ή <b>των</b> για πολλούς (πληθυντικός, λέξεις σε <b>-ων</b>).</p>
<div class="grid" id="grid"></div>
<p class="score" id="score" aria-live="polite"></p>
<div class="actions"><button class="again" id="again" hidden>Παίξε ξανά</button></div>
</main>
<script>
const W=[["γιατρό","τον"],["χαλιών","των"],["πίνακα","τον"],["καφέ","τον"],["τροχό","τον"],["μελανιών","των"],["μολυβιών","των"],["βιβλίων","των"],["χαρτιών","των"],["χάρτη","τον"],["κάδο","τον"],["άνθρωπο","τον"],["σάκων","των"],["δάσκαλο","τον"],["χάρακα","τον"],["μπαμπά","τον"],["αετών","των"],["κυριών","των"],["μελιών","των"],["μάγειρα","τον"]];
let done=0,right=0;
function build(){
 const g=document.getElementById("grid");g.innerHTML="";done=0;right=0;
 document.getElementById("score").textContent="";document.getElementById("again").hidden=true;
 W.forEach(([w,a])=>{
  const d=document.createElement("div");d.className="item";
  d.innerHTML=`<span class="slot">……</span><span class="word">${w}</span><span class="choice"><button>τον</button><button>των</button></span>`;
  const slot=d.querySelector(".slot"),ch=d.querySelector(".choice");
  ch.querySelectorAll("button").forEach(b=>b.onclick=()=>{
   const ok=b.textContent===a;
   slot.textContent=ok?a:a+" ✗";
   d.classList.add(ok?"ok":"no");
   if(!ok)slot.title="Η σωστή απάντηση είναι: "+a;
   ch.remove();done++;if(ok)right++;
   if(done===W.length){document.getElementById("score").textContent=`Βρήκες ${right} από ${W.length} σωστά! ${right===W.length?"🏆":"👏"}`;document.getElementById("again").hidden=false;}
  });
  g.appendChild(d);
 });
}
document.getElementById("again").onclick=build;build();
</script>
</body>
</html>
