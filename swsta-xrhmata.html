<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Διάλεξε τα σωστά χρήματα</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef7ff;--card:#ffffff;--ink:#1d3557;--soft:#5b6f8a;--line:#c7d8ea;--accent:#1a9ad6;--ok:#2a9d5c;--okbg:#e3f6ea;--no:#d9480f;--nobg:#fde9e1;--tag:#fff3c4;--field:#f2f7fb;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#13202f;--card:#1c2d40;--ink:#e8f1fb;--soft:#a9bbd0;--line:#334962;--accent:#4fb3e6;--ok:#5fd394;--okbg:#173a2a;--no:#ff8a5c;--nobg:#45251a;--tag:#4a4222;--field:#24384f;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#13202f;--card:#1c2d40;--ink:#e8f1fb;--soft:#a9bbd0;--line:#334962;--accent:#4fb3e6;--ok:#5fd394;--okbg:#173a2a;--no:#ff8a5c;--nobg:#45251a;--tag:#4a4222;--field:#24384f;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comfortaa","Trebuchet MS",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:1.7rem;margin:4px 0 6px}
.lead{color:var(--soft);margin:0 0 10px;font-size:1.05rem;line-height:1.5}
.row{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:14px}
.item{text-align:center}
.emoji{font-size:2.8rem;line-height:1}
.price{display:inline-block;margin-top:6px;background:var(--tag);border:2px solid var(--ink);border-radius:10px;padding:3px 10px;font-weight:700;font-size:1.15rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button.opt{font:inherit;color:inherit;background:transparent;border:2px dashed var(--line);border-radius:14px;padding:10px 6px;min-height:96px;cursor:pointer;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:center;transition:transform .12s}
button.opt:hover:not(:disabled){transform:scale(1.04);border-color:var(--ink)}
button.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.opt.ok{border:3px solid var(--ok);background:var(--okbg)}
button.opt.no{border:3px solid var(--no);background:var(--nobg)}
button.opt:disabled{cursor:default}
.c{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;color:#1d1d1d;font-size:.8rem}
.e1{width:44px;height:44px;background:#c9ccd1;border:5px solid #e3b94a}
.e2{width:48px;height:48px;background:#e3b94a;border:5px solid #c9ccd1}
.l50{width:40px;height:40px;background:#e3b94a}
.l20{width:37px;height:37px;background:#e3b94a}
.l5{width:31px;height:31px;background:#c87533;color:#fff}
.n{display:inline-flex;align-items:center;justify-content:center;border-radius:5px;font-weight:700;color:#1d1d1d;height:40px}
.n5{width:68px;background:#b9c7d6;border:2px solid #7a8da3}
.n10{width:76px;background:#f0a8a0;border:2px solid #b5655c}
.msg{grid-column:1/-1;min-height:1.4em;margin:0;font-weight:700;text-align:center}
.msg.ok{color:var(--ok)}.msg.no{color:var(--no)}
.score{text-align:center;font-size:1.3rem;font-weight:700;margin-top:18px}
.actions{text-align:center}
.intro{text-align:center;padding:10px 0 4px}
.intro h2{margin:0 0 12px;font-size:1.5rem}
.intro input{font:inherit;font-size:1.3rem;padding:10px 14px;border:3px solid var(--accent);border-radius:12px;background:var(--field);color:var(--ink);width:min(280px,90%);text-align:center}
.intro input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.big{font:inherit;font-weight:700;font-size:1.1rem;background:var(--ink);color:var(--card);border:0;border-radius:12px;padding:11px 26px;cursor:pointer;margin-top:12px}
.big:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.err{color:var(--no);font-weight:700;min-height:1.3em;margin:8px 0 0}
.hello{text-align:center;color:var(--soft);margin:0 0 14px}
.saved{text-align:center;font-weight:700;color:var(--soft);min-height:1.3em;margin:6px 0 0}
@media (max-width:560px){.row{grid-template-columns:1fr}.opts{gap:6px}button.opt{min-height:84px}}
@media (prefers-reduced-motion:reduce){button.opt{transition:none}}
</style>
</head>
<body>
<main>
<h1>💶 Διάλεξε τα σωστά χρήματα</h1>
<section class="intro" id="intro">
<h2>Πώς σε λένε;</h2>
<input id="nameIn" maxlength="30" autocomplete="off" aria-label="Το όνομά σου" placeholder="Το όνομά σου">
<br><button class="big" id="go">Ξεκίνα!</button>
<p class="err" id="nameErr" aria-live="polite"></p>
</section>
<section id="play" hidden>
<p class="lead">Κοίτα την τιμή και πάτησε το κουτάκι με <b>ακριβώς</b> τα σωστά χρήματα.</p>
<p class="hello" id="hello"></p>
<div id="game"></div>
<p class="score" id="score" aria-live="polite"></p>
<p class="saved" id="saved" aria-live="polite"></p>
<div class="actions"><button class="big" id="again" hidden>Παίξε ξανά</button></div>
</section>
</main>
<script src="config.js"></script>
<script>
const EX="Διάλεξε τα σωστά χρήματα";
const coin={"1":'<span class="c e1">1€</span>',"2":'<span class="c e2">2€</span>',"50":'<span class="c l50">50λ</span>',"20":'<span class="c l20">20λ</span>',"5c":'<span class="c l5">5λ</span>',"5n":'<span class="n n5">5 €</span>',"10n":'<span class="n n10">10 €</span>'};
const NM={"1":"1€","2":"2€","50":"50λ","20":"20λ","5c":"5λ","5n":"5€","10n":"10€"};
const Q=[
 {e:"📒",p:"1,50 €",o:[["1","20","20"],["1","50"],["1","5c"]],a:1},
 {e:"⚽",p:"3,00 €",o:[["2","2"],["2","20","50"],["1","1","1"]],a:2},
 {e:"🧩",p:"6,00 €",o:[["5n","1"],["2","2","1"],["1","1","1","1","1"]],a:0},
 {e:"🖍️",p:"4,50 €",o:[["2","2"],["2","2","50"],["1","1","1","1"]],a:1},
 {e:"🎁",p:"9,00 €",o:[["5n","1","1","1"],["10n"],["5n","1","1","2"]],a:2}
];
const L=["Α","Β","Γ"];
let player="",attempt=0,t0=0;
const $=id=>document.getElementById(id);
try{player=localStorage.getItem("player")||""}catch(e){}
$("nameIn").value=player;
function begin(){
 const n=$("nameIn").value.trim();
 if(!n){$("nameErr").textContent="Γράψε πρώτα το όνομά σου.";$("nameIn").focus();return;}
 player=n;try{localStorage.setItem("player",n)}catch(e){}
 $("intro").hidden=true;$("play").hidden=false;$("hello").textContent="Καλή επιτυχία, "+n+"! 🍀";
 build();
}
$("go").onclick=begin;
$("nameIn").addEventListener("keydown",e=>{if(e.key==="Enter")begin();});
function nextAttempt(){
 const k="att_"+EX+"_"+player;let n=attempt;
 try{n=parseInt(localStorage.getItem(k)||"0",10)||0;localStorage.setItem(k,String(n+1))}catch(e){}
 return n+1;
}
function send(score,total,mistakes){
 const s=Math.round((Date.now()-t0)/1000),st=$("saved");
 if(typeof SHEET_URL==="undefined"||!String(SHEET_URL).startsWith("https://script.google.com")){
  st.textContent="⚠️ Τα αποτελέσματα δεν αποθηκεύτηκαν (λείπει η σύνδεση με το Google Sheet).";return;}
 st.textContent="Αποθήκευση…";
 fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
  body:JSON.stringify({name:player,exercise:EX,attempt:attempt,score:score+"/"+total,
   mistakes:mistakes.length?mistakes.join("; "):"κανένα",time:Math.floor(s/60)+"΄ "+(s%60)+"΄΄"})})
 .then(()=>st.textContent="✔ Τα αποτελέσματα στάλθηκαν στη δασκάλα σου!")
 .catch(()=>st.textContent="⚠️ Δεν στάλθηκαν. Έλεγξε τη σύνδεση στο internet και παίξε ξανά.");
}
let done=0,right=0,wrong=[];
function build(){
 const g=$("game");g.innerHTML="";done=0;right=0;wrong=[];attempt=nextAttempt();t0=Date.now();
 $("score").textContent="";$("saved").textContent="";$("again").hidden=true;
 Q.forEach((q,i)=>{
  const r=document.createElement("div");r.className="row";
  r.innerHTML=`<div class="item"><div class="emoji">${q.e}</div><span class="price">${q.p}</span></div><div class="opts"></div><p class="msg" aria-live="polite"></p>`;
  const box=r.querySelector(".opts"),msg=r.querySelector(".msg");
  q.o.forEach((set,j)=>{
   const b=document.createElement("button");b.className="opt";b.setAttribute("aria-label","Επιλογή "+L[j]);
   b.innerHTML=set.map(k=>coin[k]).join("");
   b.onclick=()=>{
    box.querySelectorAll("button").forEach(x=>x.disabled=true);
    if(j===q.a){b.classList.add("ok");msg.textContent="Μπράβο! Σωστά! 🌟";msg.className="msg ok";right++;}
    else{b.classList.add("no");box.children[q.a].classList.add("ok");msg.textContent="Όχι ακριβώς. Το σωστό είναι το πράσινο κουτάκι.";msg.className="msg no";
     wrong.push(q.p+" → διάλεξε "+L[j]+" ("+set.map(k=>NM[k]).join("+")+"), σωστό "+L[q.a]);}
    done++;
    if(done===Q.length){$("score").textContent=`Βρήκες ${right} από ${Q.length} σωστά! ${right===Q.length?"🏆":"👏"}`;$("again").hidden=false;send(right,Q.length,wrong);}
   };
   box.appendChild(b);
  });
  g.appendChild(r);
 });
}
$("again").onclick=build;
</script>
</body>
</html>
